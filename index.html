<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Garden Planner</title>
<style>
  body{font-family:system-ui,"Noto Sans Thai",sans-serif;margin:0;background:#f4f7f1;color:#1e2a1e}
  header{background:#2f5d34;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;margin:0}
  button{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:#2f5d34;color:#fff;cursor:pointer}
  button.ghost{background:#e3ebdc;color:#2f5d34}
  button.lang{background:#fff;color:#2f5d34;padding:6px 10px}
  nav{display:flex;gap:6px;padding:10px 16px;background:#fff;position:sticky;top:0;z-index:2;box-shadow:0 1px 2px #0002}
  nav button{flex:1}
  main{padding:12px 16px 40px;max-width:640px;margin:auto}
  h2{font-size:16px;margin:18px 0 4px;color:#2f5d34}
  .card{background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 1px 2px #0002}
  .tag{font-size:12px;background:#e3ebdc;border-radius:6px;padding:2px 6px;margin-left:6px;color:#2f5d34}
  input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;border-radius:8px;border:1px solid #bbb;margin:6px 0}
  .muted{color:#667;font-size:13px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .timing{display:grid;grid-template-columns:70px repeat(12,1fr);gap:2px;align-items:center;font-size:11px;margin:4px 0}
  .timing .cell{height:14px;border-radius:3px;background:#eee}
  .timing .hd{text-align:center;color:#667}
  .modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:5}
  .sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;box-sizing:border-box}
  .photo{height:180px;border-radius:12px;background:#dfe6d8;display:flex;align-items:center;justify-content:center;color:#667;font-size:14px;margin-bottom:10px}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .hidden{display:none}
  .thumb{width:44px;height:44px;flex:none;margin-right:10px}
  .thumb svg,.photo svg{width:100%;height:100%}
  .photo{height:160px}
  .photo svg{width:130px;height:130px}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div style="display:flex;gap:8px"><button class="lang" onclick="openHelp()" id="helpBtn">?</button><button class="lang" id="langBtn" onclick="toggleLang()"></button></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"></div>

          tip:{en:'Sow a little and often for a steady supply.', th:'หว่านทีละน้อยแต่บ่อย ๆ เพื่อให้มีผลผลิตต่อเนื่อง'}},
  onion:{note:{en:'Onions add flavour with few calories and provide some vitamin C.', th:'หัวหอมให้รสชาติโดยมีแคลอรีต่ำ และมีวิตามินซีอยู่บ้าง'},
          tip:{en:'Stop watering in late summer as the bulbs swell, so they store well.', th:'หยุดรดน้ำปลายฤดูร้อนเมื่อหัวหอมกำลังโต เพื่อให้เก็บได้นาน'}},
  leek:{note:{en:'Leeks provide vitamin K and vitamin C, with a gentle flavour.', th:'ต้นหอมลีกมีวิตามินเคและวิตามินซี รสชาติอ่อนโยน'},
          tip:{en:'Plant out in deep holes so you get long white stems.', th:'ปลูกลงหลุมลึกเพื่อให้ได้ลำต้นสีขาวยาว'}},
  courgette:{note:{en:'Courgettes provide vitamin C and potassium, and are low in calories.', th:'แตงกวาซูกินีมีวิตามินซีและโพแทสเซียม และแคลอรีต่ำ'},
          tip:{en:'Pick courgettes small and often, as they grow quickly.', th:'เก็บผลตอนยังเล็กและบ่อย ๆ เพราะผลโตเร็วมาก'}},
  runner:{note:{en:'Runner beans provide fibre, folate and vitamin C.', th:'ถั่วรันเนอร์มีใยอาหาร โฟเลต และวิตามินซี'},
          tip:{en:'Pick pods regularly to keep the plant producing.', th:'เก็บฝักบ่อย ๆ เพื่อให้ต้นให้ผลผลิตต่อเนื่อง'}},
  peas:{note:{en:'Peas provide fibre, protein and vitamin C.', th:'ถั่วลันเตามีใยอาหาร โปรตีน และวิตามินซี'},
          tip:{en:'Pick pods while they are young and sweet.', th:'เก็บฝักตอนยังอ่อนและหวาน'}},
  plum:{note:{en:'Plums provide vitamin C and fibre.', th:'ลูกพลัมมีวิตามินซีและใยอาหาร'},
          tip:{en:'Prune in spring or summer, not winter, to reduce the risk of silver leaf disease.', th:'ตัดแต่งในฤดูใบไม้ผลิหรือฤดูร้อน ไม่ใช่ฤดูหนาว เพื่อลดความเสี่ยงโรคใบเงิน'}},
  hydrangea:{note:{en:'Grown for its big flower heads, which can be dried for indoor arrangements.', th:'ปลูกเพื่อชมดอกที่ใหญ่สวยงาม ดอกแห้งนำไปจัดแจกันได้'},
          tip:{en:'Light pruning in spring keeps the flowers coming.', th:'ตัดแต่งเบา ๆ ในฤดูใบไม้ผลิ เพื่อให้มีดอกต่อเนื่อง'}}
};

  chard: s(`<path d="M34 94 V46" stroke="#e05a4f"/><path d="M50 94 V40" stroke="#f0c040"/><path d="M66 94 V50" stroke="#e05a4f"/><path d="M34 46 C20 46 14 30 18 20 C30 24 36 34 34 46Z" fill="#6aa36a"/><path d="M50 40 C34 40 30 22 36 12 C52 18 56 30 50 40Z" fill="#6aa36a"/><path d="M66 50 C78 50 84 36 80 26 C68 30 62 40 66 50Z" fill="#6aa36a"/>`),

  potato: s(`<ellipse cx="50" cy="56" rx="32" ry="22" fill="#c9a06a" transform="rotate(-15 50 56)"/><circle cx="40" cy="52" r="2" fill="#7a5a30"/><circle cx="58" cy="60" r="2" fill="#7a5a30"/><circle cx="50" cy="48" r="2" fill="#7a5a30"/>`),

  spinach: s(`<path d="M50 94 V40"/><path d="M50 56 C34 56 26 46 28 30 C42 32 50 40 50 56Z" fill="#6aa36a"/><path d="M50 46 C66 46 74 36 72 20 C58 22 50 30 50 46Z" fill="#6aa36a"/>`),

};

// ---------- State ----------
const state = {
  lang: localStorage.getItem('gp_lang') || 'en',
  tab: 'garden',
  q: '',
  garden: JSON.parse(localStorage.getItem('gp_garden') || '[]')
};
const $ = id => document.getElementById(id);
const U = () => UI[state.lang];
const plantById = id => PLANTS.find(p => p.id === id);
const inRange = (m, from, to) => from <= to ? (m >= from && m <= to) : (m >= from || m <= to);
const saveGarden = () => localStorage.setItem('gp_garden', JSON.stringify(state.garden));

// ---------- Actions ----------
function toggleLang(){
  state.lang = state.lang === 'en' ? 'th' : 'en';
  localStorage.setItem('gp_lang', state.lang);
  render();
}
function setTab(t){ state.tab = t; render(); }
function setQ(v){ state.q = v; renderMain(); }
function toggleGarden(id){
  const i = state.garden.indexOf(id);
  i >= 0 ? state.garden.splice(i,1) : state.garden.push(id);
  saveGarden();
  render();
  if ($('modal').classList.contains('hidden') === false) openPlant(id);
}
function openPlant(id){
  const p = plantById(id), L = state.lang, u = U();
  const rows = p.tasks.map(([t,f,to]) => `
    <div class="timing">
      <span>${TASK[t][L]}</span>
      ${[...Array(12)].map((_,i)=>{
        const m=i+1, on=inRange(m,f,to);
        return `<span class="cell" style="${on?'background:'+TASK[t].c:''}" title="${MONTHS[L][i]}"></span>`;
      }).join('')}
    </div>`).join('');
  const header = `<div class="timing"><span></span>${MONTHS[L].map(m=>`<span class="hd">${m[0]}</span>`).join('')}</div>`;
  const legend = p.tasks.map(([t])=>`<span class="dot" style="background:${TASK[t].c}"></span>${TASK[t][L]}`).join(' &nbsp; ');
  const inG = state.garden.includes(id);
  $('modal').innerHTML = `
    <div class="sheet">
      <div class="photo">${ICONS[id]||''}</div>
      <h2 style="font-size:20px;margin:0">${p.name[L]}</h2>
      <div class="muted">${GROUP[p.group][L]}${p.poly?`<span class="tag">${u.polytunnel}</span>`:''}</div>
      ${TIPS[id] ? `<p style="margin:10px 0 4px">${TIPS[id].note[L]}</p><p class="muted" style="margin:0 0 6px">💡 ${TIPS[id].tip[L]}</p>` : ''}
      <h2>${u.timing}</h2>
      ${header}${rows}
      <div class="muted" style="margin-top:8px">${legend}</div>
      <div class="actions">
        <button class="${inG?'ghost':''}" onclick="toggleGarden('${id}')">${inG?u.remove:u.add}</button>
        <button class="ghost" onclick="closeModal()">${u.close}</button>
      </div>
    </div>`;
  $('modal').classList.remove('hidden');
}
function closeModal(){ $('modal').classList.add('hidden'); }

function openHelp(){
  const u = U();
  $('modal').innerHTML = `
    <div class="sheet">
      <h2 style="font-size:20px;margin:0">${u.helpTitle}</h2>
      ${u.helpLines.map(l => `<p>${l}</p>`).join('')}
      <hr style="border:0;border-top:1px dashed #bbb;margin:16px 0">
      <h2 style="font-size:16px;margin:0 0 6px">${u.helpVitTitle}</h2>
      ${u.helpGloss.map(([n,t]) => `<p><strong>${n}</strong>: ${t}</p>`).join('')}
      <div class="actions"><button class="ghost" onclick="closeModal()">${u.close}</button></div>
    </div>`;
  $('modal').classList.remove('hidden');
}


// ---------- Rendering ----------
function render(){
  const u = U();
  document.documentElement.lang = state.lang;
  $('title').textContent = u.title;
  $('langBtn').textContent = state.lang === 'en' ? 'ไทย' : 'EN';
  $('nav').innerHTML = ['garden','library'].map(t =>
    `<button class="${state.tab===t?'':'ghost'}" onclick="setTab('${t}')">${u[t]}</button>`).join('');
  renderMain();
}

function plantRow(p){
  const L = state.lang;
  return `<div class="card" onclick="openPlant('${p.id}')">
    <span class="thumb">${ICONS[p.id]||''}</span>
    <div style="flex:1"><strong>${p.name[L]}</strong>${p.poly?`<span class="tag">${U().polytunnel}</span>`:''}
      <div class="muted">${GROUP[p.group][L]}</div></div>
    <span class="muted">›</span></div>`;
}

// Jobs due in month m for the given plants, grouped by task. Returns '' if none.
function monthJobs(list, m){
  const L = state.lang;
  let html = '';
  for(const t of ['sow','plant','prune','harvest']){
    const items = list.filter(p => p.tasks.some(([tt,f,to]) => tt===t && inRange(m,f,to)));
    if(!items.length) continue;
    html += `<h2><span class="dot" style="background:${TASK[t].c}"></span>${TASK[t][L]}</h2>`;
    html += items.map(plantRow).join('');
  }
  return html;
}

function renderMain(){
  const u = U(), L = state.lang, m = new Date().getMonth() + 1;
  let html = '';

  if(state.tab === 'library'){
    html += `<input placeholder="${u.search}" value="${state.q}" oninput="setQ(this.value)">`;
    const q = state.q.trim().toLowerCase();
    const list = PLANTS.filter(p => !q || p.name.en.toLowerCase().includes(q) || p.name.th.includes(q));
    html += list.map(plantRow).join('') || `<p class="muted">—</p>`;
  }

  if(state.tab === 'garden'){
    const mine = state.garden.map(plantById).filter(Boolean);
    if(!mine.length){
      html += `<p class="muted">${u.emptyGarden}</p>`;
    } else {
      html += `<h2>${u.thingsTo} ${MONTH_FULL[L][m-1]}</h2>`;
      html += monthJobs(mine, m) || `<p class="muted">${u.emptyMonth}</p>`;
      html += `<h2>${u.myPlants}</h2>` + mine.map(plantRow).join('');
    }
  }

  html += `<p class="muted" style="margin-top:24px">${u.footer}</p>`;
  $('main').innerHTML = html;
}

render();
</script>
</body>
</html>
